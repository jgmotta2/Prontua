# ============================================================================
# Sereno Frontend — Nginx config
# ----------------------------------------------------------------------------
# - SPA fallback (qualquer rota -> index.html)
# - Cache imutável em /assets/* (Vite gera hash)
# - Gzip + brotli (se disponível)
# - Headers de segurança (camada extra ao Helmet do backend)
# ============================================================================

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Limites
    client_max_body_size 1m;
    server_tokens off;

    # Compressão
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    # Headers de segurança
    add_header X-Frame-Options          "DENY"                         always;
    add_header X-Content-Type-Options   "nosniff"                      always;
    add_header Referrer-Policy          "no-referrer"                  always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
    # CSP: configure de acordo com seus domínios reais em prod.
    # Aqui mantemos compatível com o build dev. Em prod, ajuste o connect-src.
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';" always;

    # Healthcheck para load balancer / Docker
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Assets do Vite (hash no nome) — cache forte
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker / manifest — não cachear
    location ~* \.(webmanifest|json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback — qualquer rota client-side cai aqui
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Bloqueia dotfiles
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Erros não vazam versão
    error_page 500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
