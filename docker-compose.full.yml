# ============================================================================
# Sereno — full stack em containers (Postgres + Redis + Backend + Frontend)
# ----------------------------------------------------------------------------
# Usado para validar localmente a build de produção antes do deploy.
# Não é a configuração final de produção — use um provedor gerenciado para
# Postgres/Redis em prod (Supabase, Neon, Upstash...).
#
# Pré-requisito: backend/.env com todos os segredos preenchidos.
#
# Uso:
#   docker compose -f docker-compose.full.yml up --build
#   # API:      http://localhost:4000
#   # Frontend: http://localhost:8080
# ============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     sereno
      POSTGRES_PASSWORD: sereno_dev_only
      POSTGRES_DB:       sereno
    volumes:
      - sereno_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U sereno -d sereno"]
      interval: 5s
      retries:  5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries:  5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Override pra apontar pros containers da rede interna
      NODE_ENV:     production
      DATABASE_URL: postgresql://sereno:sereno_dev_only@postgres:5432/sereno
      DIRECT_URL:   postgresql://sereno:sereno_dev_only@postgres:5432/sereno
      REDIS_URL:    redis://redis:6379
      CORS_ORIGINS: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
    ports:
      - "4000:4000"
    # Aplica migrations antes de subir a API
    command: >
      sh -c "npx prisma migrate deploy && node dist/main.js"

  frontend:
    build:
      context: ./frontend
      args:
        # Em prod real, aponte pra https://api.seu-dominio.com
        VITE_API_BASE_URL: http://localhost:4000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  sereno_pg_data:
