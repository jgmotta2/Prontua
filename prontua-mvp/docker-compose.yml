# ============================================================================
# Sereno — infraestrutura local para desenvolvimento
# ----------------------------------------------------------------------------
# Sobe apenas o que o `npm run dev` precisa: PostgreSQL e Redis.
# A aplicação (backend + frontend) roda na sua máquina via npm pra hot reload.
#
# Uso:
#   docker compose up -d
#   cd backend && npm run prisma:migrate && npm run dev
#   cd frontend && npm run dev
#
# Para validar a build de produção end-to-end com containers, use:
#   docker compose -f docker-compose.full.yml up --build
# ============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: sereno_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     sereno
      POSTGRES_PASSWORD: sereno_dev_only
      POSTGRES_DB:       sereno
    ports:
      - "5432:5432"
    volumes:
      - sereno_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U sereno -d sereno"]
      interval: 5s
      timeout:  3s
      retries:  5

  redis:
    image: redis:7-alpine
    container_name: sereno_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout:  3s
      retries:  5

volumes:
  sereno_pg_data:
